name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-14
            cc: ""
            ext: ""
          - os: darwin
            arch: amd64
            runner: macos-15
            cc: ""
            ext: ""
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            cc: gcc
            ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            cc: aarch64-linux-gnu-gcc
            ext: ""
          # Windows build temporarily disabled — internal/lock uses syscall.Flock
          # which is POSIX-only. Re-enable once a Windows-compatible lock path
          # is implemented.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cross-compilers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build -tags fts5 -ldflags="-s -w -X main.Version=${VERSION}" -o "agent-relay${{ matrix.ext }}" .

      - name: Package (tar.gz)
        if: matrix.os != 'windows'
        run: |
          tar -czf "agent-relay-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" agent-relay

      - name: Package (zip)
        if: matrix.os == 'windows'
        run: |
          zip "agent-relay-${{ matrix.os }}-${{ matrix.arch }}.zip" "agent-relay${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-relay-${{ matrix.os }}-${{ matrix.arch }}
          path: agent-relay-${{ matrix.os }}-${{ matrix.arch }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # nullglob makes unmatched globs expand to nothing (no .zip if no
          # Windows build is in the matrix).
          shopt -s nullglob

          VERSION="${GITHUB_REF_NAME}"

          # Stamp the version into the installer so its skill/hooks/source
          # fetches resolve to this exact tag instead of `main`.
          sed -i "s|@@RELAY_VERSION@@|${VERSION}|g" scripts/install.sh

          # Bundle the skill (SKILL.md + references/ + hooks/) so the installer
          # fetches everything in one shot from this release.
          tar -czf skill-relay.tar.gz -C skill/relay .

          # Create release if it doesn't exist, then upload assets
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --latest \
            2>/dev/null || true

          gh release upload "$VERSION" \
            artifacts/agent-relay-*.tar.gz \
            artifacts/agent-relay-*.zip \
            scripts/install.sh \
            skill-relay.tar.gz \
            --clobber
